[project]
name = "tv-tracker"
version = "0.1.0"
description = "Get notified when new episodes and seasons of TV Shows get released"
readme = "README.md"
license = "GPL-3.0+"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "mypy>=1.18.2",
    "numpy>=2.3.3",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.1.1",
    "requests>=2.32.4",
    "sqlmodel>=0.0.38",
    "types-requests>=2.32.4.20250913",
]
[tool.pytest.ini_options]
pythonpath = [
    "./src"
]
